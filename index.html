<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αγωνιστικές - Χώροι & Στέκια</title>
    
    <!-- Εισαγωγή του Tailwind CSS για το styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Εισαγωγή της γραμματοσειράς Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Εισαγωγή του Font Awesome για τα εικονίδια στα κουμπιά -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Απαλό γκρι φόντο */
        }
        
        /* Εφέ στα κουμπιά κατά το hover (πέρασμα του ποντικιού) */
        .btn-hover-effect {
            transition: all 0.3s ease;
        }
        .btn-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Προσαρμοσμένα χρώματα για τα κοινωνικά δίκτυα */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }
        .btn-facebook {
            background-color: #1877F2;
            color: white;
        }
        .btn-website {
            background-color: #374151; /* Σκούρο γκρι */
            color: white;
        }
    </style>
</head>

                    <!-- Κουμπιά Links -->

                        <a href="https://www.instagram.com/ektos_twn_teixwn/?__pwa=1" target="_blank" rel="noopener noreferrer" class="btn-instagram btn-hover-effect px-5 py-2.5 rounded-lg font-semibold flex items-center gap-2 text-sm">

                        <a href="https://www.facebook.com/ektostwnteixwn" target="_blank" rel="noopener noreferrer" class="btn-facebook btn-hover-effect px-5 py-2.5 rounded-lg font-semibold flex items-center gap-2 text-sm">
